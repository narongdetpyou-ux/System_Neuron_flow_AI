name: Study guide eval with GitHub Models (manual)
# Scores the study guide (study_guide.v1, roadmap 3.3) on the synthetic request set with a real model from
# GitHub Models (ADR-020). Free within GitHub's rate limits: no API key, no card. The workflow's own
# GITHUB_TOKEN calls the models, with only the permissions below. Per request, up to two short calls (find the
# topic, then explain the plan; 67 requests), so requests start at least 10 seconds apart. That is most of
# one model's free daily allowance (about 150 requests): run the shadow eval on another day or another model.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "GitHub Models id (publisher/model)"
        default: "openai/gpt-4.1-mini"
        required: true
      limit:
        description: "Only the first N requests (leave empty for all)"
        default: ""
        required: false
permissions:
  contents: read
  models: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEURON_FLOW_LLM_PROVIDER: github
      NEURON_FLOW_LLM_MODEL: ${{ inputs.model }}
      LIMIT: ${{ inputs.limit }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: List the models GitHub offers
        continue-on-error: true
        run: python .github/scripts/github_models_catalog.py "$GITHUB_STEP_SUMMARY"
      - name: Score the study guide with GitHub Models
        run: |
          ARGS=()
          if [ -n "$LIMIT" ]; then ARGS=(--limit "$LIMIT"); fi
          python -m app.eval.study_guide_eval --min-interval-s 10 --summary "$GITHUB_STEP_SUMMARY" \
            --out study-guide-eval-github-models.json "${ARGS[@]}"
      - name: Keep the scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: study-guide-eval-github-models
          path: study-guide-eval-github-models.json
          if-no-files-found: ignore
