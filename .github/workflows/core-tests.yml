name: Core logic tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Run synthetic domain demonstration
        run: python -m examples.case_triage_demo
      - name: Run shadow-mode demonstration (offline mock AI)
        run: python -m examples.case_triage_shadow_demo
      # The study guide's answers to four synthetic requests, shown on the run page (roadmap 3.2).
      - name: Run study guide demonstration (offline mock AI)
        run: python -m examples.study_guide_demo --summary "$GITHUB_STEP_SUMMARY"
      # Eval gate (roadmap 5.2): fails when any case answers differently from the committed baseline. It runs
      # even when an earlier step failed, so the run page always lists what changed.
      - name: Score shadow mode and compare every case with the baseline (offline mock AI)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.triage_shadow_eval --summary "$GITHUB_STEP_SUMMARY" --out shadow-eval-mock.json
          --compare-with tests/baselines/shadow_eval_mock.json
      # The study guide's scorecard and eval gate (roadmap 3.3): fails when a promise breaks (a link outside the
      # library, more than 5 resources) or when any request answers differently from the baseline.
      - name: Score the study guide and compare every request with the baseline (offline mock AI)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.study_guide_eval --summary "$GITHUB_STEP_SUMMARY" --out study-guide-eval-mock.json
          --compare-with tests/baselines/study_guide_eval_mock.json
      # Robustness benchmark, stage 1 (roadmap 5.4, docs/benchmarking.md): 270 synthetic edge cases and four pinned open
      # datasets through intake, rules, masking, AI replies, Core contracts and whole jobs, offline (mock AI and a local
      # fake of the Typhoon API). Fails when any item's outcome differs from the baseline, which records failures too.
      - name: Robustness benchmark, stage 1 (compares every item with the baseline)
        if: ${{ !cancelled() }}
        run: >-
          python -m tests.robustness.bench --summary "$GITHUB_STEP_SUMMARY" --out robustness.json
          --compare-with tests/baselines/robustness_v1.json
      - name: Keep the scorecards
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-mock
          path: |
            shadow-eval-mock.json
            study-guide-eval-mock.json
            robustness.json
