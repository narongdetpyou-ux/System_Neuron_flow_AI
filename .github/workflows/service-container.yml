name: Service container (same build as Render)
# Builds the Dockerfile that Render uses (render.yaml), starts it with a data disk that is mounted as
# root and without CAP_KILL (as on Render), submits cases over HTTP, restarts the container (like a
# redeploy), checks that nothing was lost and that both stops were graceful. Render deploys main only
# when these checks pass (autoDeployTrigger: checksPass).
# It also reports the image's size, its bytecode cache and how long the first case after a start takes,
# at the runner's full speed and with 0.1 CPU (effectiveness plan E1). Times are reported, never gated.
# The access key below is a throwaway value used only inside this job.
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6" "jsonschema>=4"
      - name: Check render.yaml, its build filter, and Render's published schema when it can be fetched
        run: python .github/scripts/check_render_blueprint.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCESS_KEY: ci-throwaway-access-key-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the image
        run: docker build -t neuron-flow:ci .
      - name: Report the image's size and its bytecode cache (effectiveness plan E1)
        # A process that finds no cache file for a module compiles it from source at every start, and
        # the service cannot write a cache itself. The script runs inside the image as the service user.
        run: |
          size="$(docker image inspect neuron-flow:ci --format '{{.Size}}')"
          echo "image-size $size bytes"
          {
            echo "### ภาพของบริการ (container image)"
            echo ""
            echo "- ขนาด: $((size / 1000000)) MB ($size bytes)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          docker run --rm -i --entrypoint python --user neuron neuron-flow:ci - \
            --label "ความเร็วเต็มของเครื่อง GitHub" < .github/scripts/check_image_bytecode.py > bytecode.md || status=$?
          # The same start, held to a tenth of a processor: the share Render lists for its free instances.
          # An imitation on GitHub's machine, not a measurement on Render.
          docker run --rm -i --cpus 0.1 --entrypoint python --user neuron neuron-flow:ci - --timing-only --runs 5 \
            --label "จำกัด 0.1 CPU (เลียนแบบเครื่องฟรีของ Render ไม่ใช่ Render จริง)" \
            < .github/scripts/check_image_bytecode.py >> bytecode.md || status=$?
          cat bytecode.md
          { grep -v -e '^bytecode-report ' -e '^::' bytecode.md; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Time the first case after a start with 0.1 CPU (a report that does not fail on a time)
        run: |
          docker run -d --name nf-slow -p 8001:8000 --cpus 0.1 --cap-drop KILL \
            -e NEURON_FLOW_ACCESS_KEY="$ACCESS_KEY" neuron-flow:ci
          python -m examples.service_smoke_test --url http://127.0.0.1:8001 --key "$ACCESS_KEY" \
            --first-case-only --timeout 120 --summary "$GITHUB_STEP_SUMMARY" \
            --label "จำกัด 0.1 CPU (เลียนแบบเครื่องฟรีของ Render ไม่ใช่ Render จริง)"
          docker logs nf-slow 2>&1 | tail -n 30 || true
          docker rm -f nf-slow
      - name: Start the service with a data disk (configured as in render.yaml's paid variant)
        # --cap-drop KILL: like Render's containers, root here may not signal another user's processes.
        # On Render that stopped tini (process 1, root) from passing SIGTERM on to the service, which runs
        # as the neuron user: "[FATAL tini (1)] Unexpected error when forwarding signal: 'Operation not
        # permitted'" (2026-11-01), and every deploy killed the service instead of stopping it.
        run: |
          docker volume create nf-data
          docker run -d --name nf -p 8000:8000 --cap-drop KILL \
            -e NEURON_FLOW_ACCESS_KEY="$ACCESS_KEY" \
            -e NEURON_FLOW_DATA_DIR=/var/data \
            -v nf-data:/var/data neuron-flow:ci
      - name: Submit cases over HTTP and wait for the results
        run: |
          python -m examples.service_smoke_test --url http://127.0.0.1:8000 --key "$ACCESS_KEY" --state smoke.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Check the service runs without root and owns its data
        run: |
          docker exec -i nf python - <<'EOF'
          import pathlib

          def uids(proc):  # real, effective, saved and filesystem user ids
              status = (proc / "status").read_text()
              return set(next(line.split()[1:] for line in status.splitlines() if line.startswith("Uid:")))

          # Process 1 is tini, and it must run as the service user too: without CAP_KILL (as on Render) a
          # root tini cannot pass stop signals on to the service (app/boot.py).
          init = pathlib.Path("/proc/1")
          init_command = (init / "cmdline").read_bytes().split(b"\0")
          print("1", b" ".join(init_command).decode().strip(), "uids", sorted(uids(init)))
          assert init_command[0].rsplit(b"/", 1)[-1] == b"tini", "process 1 should be tini"
          assert uids(init) == {"10001"}, "process 1 (tini) still runs as root"
          found = 0
          for proc in pathlib.Path("/proc").glob("[0-9]*"):
              try:
                  command = (proc / "cmdline").read_bytes().split(b"\0")
                  ids = uids(proc)
              except OSError:
                  continue
              # The Python processes: the launcher and the Runner.
              is_python = b"python" in command[0].rsplit(b"/", 1)[-1]
              if is_python and (b"app.serve" in command or b"app.services.runner" in command):
                  print(proc.name, b" ".join(command).decode().strip(), "uids", sorted(ids))
                  assert ids == {"10001"}, "a service process still runs as root"
                  found += 1
          assert found == 2, f"expected the launcher and the Runner, found {found}"
          EOF
          test "$(docker exec nf stat -c %U /var/data/app/queue.sqlite3)" = neuron
      - name: Restart the container and check nothing was lost
        run: |
          docker restart -t 30 nf
          python -m examples.service_smoke_test --url http://127.0.0.1:8000 --key "$ACCESS_KEY" --state smoke.json --after-restart
      - name: Stop gracefully, and check the restart above was graceful too
        run: |
          docker stop -t 30 nf
          logs="$(docker logs nf 2>&1)"
          if grep -q "FATAL tini" <<<"$logs"; then
            echo "::error::tini could not pass the stop signal on, so the service was killed instead of stopped"
            grep "FATAL tini" <<<"$logs"
            exit 1
          fi
          # Two stops: the restart and this one. Both must reach the launcher and the Runner.
          for line in "serve: stopping" "runner: stopping after the current job"; do
            count="$(grep -c "$line" <<<"$logs" || true)"
            echo "\"$line\": $count"
            test "$count" -ge 2 || { echo "::error::expected \"$line\" after the restart and after the stop"; exit 1; }
          done
          if grep -q "$ACCESS_KEY" <<<"$logs"; then echo "::error::the access key appeared in the logs"; exit 1; fi
      - name: Service logs
        if: always()
        run: docker logs nf 2>&1 | tail -n 80 || true
