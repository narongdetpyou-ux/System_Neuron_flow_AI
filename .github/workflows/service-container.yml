name: Service container (same build as Render)
# Builds the Dockerfile that Render uses (render.yaml), starts it with a data disk that is mounted as
# root, submits cases over HTTP, restarts the container (like a redeploy) and checks that nothing was
# lost. Render deploys main only when these checks pass (autoDeployTrigger: checksPass).
# The access key below is a throwaway value used only inside this job.
on:
  push:
  pull_request:
jobs:
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6" "jsonschema>=4"
      - name: Check render.yaml (and Render's published schema when it can be fetched)
        run: |
          python - <<'EOF'
          import json, sys, urllib.request
          import jsonschema, yaml
          blueprint = yaml.safe_load(open("render.yaml", encoding="utf-8"))
          (service,) = blueprint["services"]
          assert (service["type"], service["runtime"], service["healthCheckPath"]) == ("web", "docker", "/healthz"), service
          assert service["autoDeployTrigger"] == "checksPass", service
          assert {"key": "NEURON_FLOW_ACCESS_KEY", "generateValue": True} in service["envVars"], service["envVars"]
          if "disk" in service:
              assert service["plan"] != "free", "free web services cannot have a disk"
              assert {"key": "NEURON_FLOW_DATA_DIR", "value": service["disk"]["mountPath"]} in service["envVars"]
          try:
              with urllib.request.urlopen("https://render.com/schema/render.yaml.json", timeout=20) as response:
                  schema = json.load(response)
          except Exception as exc:
              print(f"::warning::Render's schema could not be fetched ({type(exc).__name__}); checked the structure only")
              sys.exit(0)
          try:
              jsonschema.validate(blueprint, schema)
          except jsonschema.ValidationError as exc:
              print(f"::error::render.yaml does not match Render's schema: {exc.message} (at {list(exc.absolute_path)})")
              sys.exit(1)
          except Exception as exc:
              print(f"::warning::Render's schema could not be applied ({type(exc).__name__}); checked the structure only")
              sys.exit(0)
          print("render.yaml matches Render's published schema")
          EOF
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCESS_KEY: ci-throwaway-access-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the image
        run: docker build -t neuron-flow:ci .
      - name: Start the service with a data disk (configured as in render.yaml's paid variant)
        run: |
          docker volume create nf-data
          docker run -d --name nf -p 8000:8000 \
            -e NEURON_FLOW_ACCESS_KEY="$ACCESS_KEY" \
            -e NEURON_FLOW_DATA_DIR=/var/data \
            -v nf-data:/var/data neuron-flow:ci
      - name: Submit cases over HTTP and wait for the results
        run: python -m examples.service_smoke_test --url http://127.0.0.1:8000 --key "$ACCESS_KEY" --state smoke.json
      - name: Check the service runs without root and owns its data
        run: |
          docker exec -i nf python - <<'EOF'
          import pathlib
          found = 0
          for proc in pathlib.Path("/proc").glob("[0-9]*"):
              try:
                  command = (proc / "cmdline").read_bytes().split(b"\0")
                  status = (proc / "status").read_text()
              except OSError:
                  continue
              # Only the Python processes; tini (process 1) stays root by design to forward signals.
              is_python = b"python" in command[0].rsplit(b"/", 1)[-1]
              if is_python and (b"app.serve" in command or b"app.services.runner" in command):
                  uid = next(line.split()[1] for line in status.splitlines() if line.startswith("Uid:"))
                  print(proc.name, b" ".join(command).decode().strip(), "uid", uid)
                  assert uid == "10001", "a service process still runs as root"
                  found += 1
          assert found == 2, f"expected the launcher and the Runner, found {found}"
          EOF
          test "$(docker exec nf stat -c %U /var/data/app/queue.sqlite3)" = neuron
      - name: Restart the container and check nothing was lost
        run: |
          docker restart -t 30 nf
          python -m examples.service_smoke_test --url http://127.0.0.1:8000 --key "$ACCESS_KEY" --state smoke.json --after-restart
      - name: Stop gracefully
        run: |
          docker stop -t 30 nf
          docker logs nf 2>&1 | grep "serve: stopping"
          docker logs nf 2>&1 | grep "runner: stopping after the current job"
          if docker logs nf 2>&1 | grep -q "$ACCESS_KEY"; then echo "::error::the access key appeared in the logs"; exit 1; fi
      - name: Service logs
        if: always()
        run: docker logs nf 2>&1 | tail -n 80 || true
