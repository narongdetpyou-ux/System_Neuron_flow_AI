name: Service container (same build as Railway)
# Builds the Dockerfile that Railway uses, starts it with a data volume that is mounted as root
# (as on Railway), submits cases over HTTP, restarts the container (like a redeploy) and checks
# that nothing was lost. The access key below is a throwaway value used only inside this job.
on:
  push:
  pull_request:
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCESS_KEY: ci-throwaway-access-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the image
        run: docker build -t neuron-flow:ci .
      - name: Start the service with a volume
        run: |
          docker volume create nf-data
          docker run -d --name nf -p 8000:8000 \
            -e NEURON_FLOW_ACCESS_KEY="$ACCESS_KEY" \
            -e RAILWAY_VOLUME_MOUNT_PATH=/var/data \
            -v nf-data:/var/data neuron-flow:ci
      - name: Submit cases over HTTP and wait for the results
        run: python -m examples.service_smoke_test --url http://127.0.0.1:8000 --key "$ACCESS_KEY" --state smoke.json
      - name: Check the service runs without root and owns its data
        run: |
          docker exec -i nf python - <<'EOF'
          import pathlib
          found = 0
          for proc in pathlib.Path("/proc").glob("[0-9]*"):
              try:
                  command = (proc / "cmdline").read_bytes().split(b"\0")
                  status = (proc / "status").read_text()
              except OSError:
                  continue
              # Only the Python processes; tini (process 1) stays root by design to forward signals.
              is_python = b"python" in command[0].rsplit(b"/", 1)[-1]
              if is_python and (b"app.serve" in command or b"app.services.runner" in command):
                  uid = next(line.split()[1] for line in status.splitlines() if line.startswith("Uid:"))
                  print(proc.name, b" ".join(command).decode().strip(), "uid", uid)
                  assert uid == "10001", "a service process still runs as root"
                  found += 1
          assert found == 2, f"expected the launcher and the Runner, found {found}"
          EOF
          test "$(docker exec nf stat -c %U /var/data/app/queue.sqlite3)" = neuron
      - name: Restart the container and check nothing was lost
        run: |
          docker restart -t 30 nf
          python -m examples.service_smoke_test --url http://127.0.0.1:8000 --key "$ACCESS_KEY" --state smoke.json --after-restart
      - name: Stop gracefully
        run: |
          docker stop -t 30 nf
          docker logs nf 2>&1 | grep "serve: stopping"
          docker logs nf 2>&1 | grep "runner: stopping after the current job"
          if docker logs nf 2>&1 | grep -q "$ACCESS_KEY"; then echo "::error::the access key appeared in the logs"; exit 1; fi
      - name: Service logs
        if: always()
        run: docker logs nf 2>&1 | tail -n 80 || true
