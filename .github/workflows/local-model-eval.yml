name: Local open model eval
# Runs pinned open-weight model files on the GitHub runner itself (ADR-026, ADR-034): llama.cpp's server, built from
# a pinned commit, serves one file at a time on 127.0.0.1 only, so nothing leaves the runner for an AI company.
# The files are pinned by size and SHA-256 in .github/local_models.json:
# - typhoon2.5-qwen3-4b-q4_k_m: the publisher's Typhoon 2.5 Qwen3 4B (SCB 10X, Apache-2.0), from Hugging Face;
# - nf-typhoon4b-v01-q4_k_m: the owner's QLoRA fine-tune of it for case triage, from a private link kept in the
#   repository secret NF_MODEL_URL (and NF_MODEL_TOKEN when the link needs a sign-in). It is never cached in Actions
#   and never uploaded: this repository is public.
# For each chosen model, .github/scripts/local_model_lane.py starts the server, times the first answer, runs the
# triage scorecards on the chosen case sets, runs the end-to-end check through the real service (people decide,
# receipts, failure paths) and records memory and speed. "both" runs the two files one after the other on the same
# runner, so their latency can be compared, then compares them case by case (and with Typhoon 30B's saved run).
# Standard runners are free for this public repository (4 CPUs, 16 GB): CPU only, so answers take seconds.
# Synthetic data only (rule 9). Shadow mode is unchanged: every case still waits for a person.
# - Pull requests that change this lane get a smoke run: the publisher's file, 5 cases, 5 requests, a quick end-to-end.
# - Actions -> Local open model eval -> Run workflow runs what is chosen below.
on:
  pull_request:
    paths:
      - ".github/workflows/local-model-eval.yml"
      - ".github/local_models.json"
      - ".github/scripts/fetch_model.py"
      - ".github/scripts/llm_probe.py"
      - ".github/scripts/local_model_lane.py"
      - "tests/local_model_e2e.py"
      - "tests/local_model_compare.py"
      - "app/llm/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model file: the publisher's 4B, the owner's fine-tune (needs the secret NF_MODEL_URL), or both on one runner"
        type: choice
        options:
          - typhoon2.5-qwen3-4b-q4_k_m
          - nf-typhoon4b-v01-q4_k_m
          - both
        default: typhoon2.5-qwen3-4b-q4_k_m
      triage_sets:
        description: "Triage case sets: all five (409 cases), or one of synthetic, edge, heldout, hard, attention"
        type: choice
        options:
          - all
          - synthetic
          - edge
          - heldout
          - hard
          - attention
        default: all
      limit:
        description: "Only the first N cases of each set (leave empty for all)"
        default: ""
        required: false
      study_guide:
        description: "Also the study guide's 67 requests (about 55 minutes a model; new study-guide work is paused)"
        type: boolean
        default: false
      e2e:
        description: "End-to-end check through the real service: full (12 cases), quick (4) or none"
        type: choice
        options:
          - full
          - quick
          - none
        default: full
permissions:
  contents: read
concurrency:
  group: local-model-eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # llama.cpp: built from this tag, which must be this commit (checked after the clone).
  LLAMA_CPP_TAG: b12198
  LLAMA_CPP_COMMIT: f477f795cb071baf5b8af6488378366a72034ac4
  BASE_MODEL: typhoon2.5-qwen3-4b-q4_k_m
  FINETUNE_MODEL: nf-typhoon4b-v01-q4_k_m
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEURON_FLOW_LLM_PROVIDER: local
      # CPU answers are slow: the longest wait the client allows (Core's step limit is this + 15 s).
      NEURON_FLOW_LLM_TIMEOUT_S: "300"
      MODEL_CHOICE: ${{ github.event_name == 'pull_request' && 'typhoon2.5-qwen3-4b-q4_k_m' || inputs.model }}
      TRIAGE_SETS: ${{ github.event_name == 'pull_request' && 'synthetic' || inputs.triage_sets }}
      LIMIT: ${{ github.event_name == 'pull_request' && '5' || inputs.limit }}
      STUDY_GUIDE: ${{ github.event_name == 'pull_request' && 'true' || inputs.study_guide }}
      E2E: ${{ github.event_name == 'pull_request' && 'quick' || inputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the llama.cpp server build
        id: llama-cache
        uses: actions/cache@v6
        with:
          path: ~/llama-bin
          key: llama-server-${{ env.LLAMA_CPP_COMMIT }}-${{ runner.os }}-${{ runner.arch }}-avx2-v1
      # Portable CPU flags (AVX2, FMA, F16C), so a cached build runs on any of GitHub's x64 runners. No HTTPS,
      # no web UI and nothing downloaded at build time: the server only answers on 127.0.0.1.
      - name: Build llama.cpp's server at the pinned commit
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          got="$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)"
          if [ "$got" != "$LLAMA_CPP_COMMIT" ]; then
            echo "::error::llama.cpp tag $LLAMA_CPP_TAG is commit $got, not the pinned $LLAMA_CPP_COMMIT"
            exit 1
          fi
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-server -j "$(nproc)"
          mkdir -p ~/llama-bin
          cp "$RUNNER_TEMP/llama-build/bin/llama-server" ~/llama-bin/
      # Which files run, in which order, and where each is kept: a public file in ~/models/public (the only folder
      # the cache below saves), a file that is not published in $RUNNER_TEMP/private-models (never cached).
      - name: Choose the models
        id: choose
        run: |
          case "$MODEL_CHOICE" in
            both) models=("$BASE_MODEL" "$FINETUNE_MODEL") ;;
            "$BASE_MODEL"|"$FINETUNE_MODEL") models=("$MODEL_CHOICE") ;;
            *) echo "::error::Unknown model $MODEL_CHOICE"; exit 1 ;;
          esac
          index=0
          for model in "${models[@]}"; do
            index=$((index + 1))
            described="$RUNNER_TEMP/describe-$index.txt"
            python .github/scripts/fetch_model.py --profile .github/local_models.json --model "$model" --describe \
              --github-output "$described" > /dev/null
            if grep -qx "cache=true" "$described"; then dest="$HOME/models/public"; else dest="$RUNNER_TEMP/private-models"; fi
            echo "model_$index=$model" >> "$GITHUB_OUTPUT"
            echo "dest_$index=$dest" >> "$GITHUB_OUTPUT"
          done
          echo "uses_base=$([[ " ${models[*]} " == *" $BASE_MODEL "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### โมเดลที่รันรอบนี้ (models in this run)"
            echo ""
            for model in "${models[@]}"; do echo "- \`$model\`"; done
            echo ""
            echo "ชุดเคส: \`$TRIAGE_SETS\` · จำกัดจำนวน: \`${LIMIT:-ทั้งหมด}\` · แนะนำแหล่งเรียน: \`$STUDY_GUIDE\` · ทดสอบปลายทาง: \`$E2E\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the publisher's model file
        if: steps.choose.outputs.uses_base == 'true'
        uses: actions/cache@v6
        with:
          path: ~/models/public
          key: local-model-public-typhoon2.5-qwen3-4b-q4_k_m-b365302922688f3a3c9ac8e3c00ab97a152cac0cdbf4eb5a734ecb483ae3e511-v2
      - name: Download and check the first model file
        id: m1
        env:
          MODEL: ${{ steps.choose.outputs.model_1 }}
          DEST: ${{ steps.choose.outputs.dest_1 }}
          # The private link and its optional token reach this step only, and only on a run started by hand.
          NF_MODEL_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.NF_MODEL_URL || '' }}
          NF_MODEL_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.NF_MODEL_TOKEN || '' }}
        run: >-
          python .github/scripts/fetch_model.py --profile .github/local_models.json --model "$MODEL" --dest "$DEST"
          --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
      - name: Run the first model (server on 127.0.0.1, scorecards, end-to-end check, memory and speed)
        if: ${{ !cancelled() && steps.m1.outcome == 'success' }}
        env:
          MODEL_PATH: ${{ steps.m1.outputs.path }}
          MODEL_ID: ${{ steps.m1.outputs.model_id }}
          MODEL_SHA: ${{ steps.m1.outputs.sha256 }}
        run: |
          ARGS=(--triage-sets "$TRIAGE_SETS" --e2e "$E2E")
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          if [ "$STUDY_GUIDE" = "true" ]; then ARGS+=(--study-guide); fi
          python .github/scripts/local_model_lane.py --server-cmd "$HOME/llama-bin/llama-server" \
            --model-path "$MODEL_PATH" --model-id "$MODEL_ID" --model-sha256 "$MODEL_SHA" --out-dir lane \
            --log-dir "$RUNNER_TEMP" --summary "$GITHUB_STEP_SUMMARY" "${ARGS[@]}"
      - name: Download and check the second model file
        id: m2
        if: ${{ !cancelled() && steps.choose.outputs.model_2 != '' }}
        env:
          MODEL: ${{ steps.choose.outputs.model_2 }}
          DEST: ${{ steps.choose.outputs.dest_2 }}
          NF_MODEL_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.NF_MODEL_URL || '' }}
          NF_MODEL_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.NF_MODEL_TOKEN || '' }}
        run: >-
          python .github/scripts/fetch_model.py --profile .github/local_models.json --model "$MODEL" --dest "$DEST"
          --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
      - name: Run the second model on the same runner
        if: ${{ !cancelled() && steps.m2.outcome == 'success' }}
        env:
          MODEL_PATH: ${{ steps.m2.outputs.path }}
          MODEL_ID: ${{ steps.m2.outputs.model_id }}
          MODEL_SHA: ${{ steps.m2.outputs.sha256 }}
        run: |
          ARGS=(--triage-sets "$TRIAGE_SETS" --e2e "$E2E")
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          if [ "$STUDY_GUIDE" = "true" ]; then ARGS+=(--study-guide); fi
          python .github/scripts/local_model_lane.py --server-cmd "$HOME/llama-bin/llama-server" \
            --model-path "$MODEL_PATH" --model-id "$MODEL_ID" --model-sha256 "$MODEL_SHA" --out-dir lane \
            --log-dir "$RUNNER_TEMP" --summary "$GITHUB_STEP_SUMMARY" "${ARGS[@]}"
      # Optional: when the secret NF_TRAINING_URL links to the fine-tune's training data, count the test cases that
      # also appear in it (only this repository's case ids and counts are written; the training text never is).
      - name: Check the test cases against the fine-tune's training data (optional)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (steps.choose.outputs.model_1 == env.FINETUNE_MODEL || steps.choose.outputs.model_2 == env.FINETUNE_MODEL) }}
        env:
          NF_TRAINING_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.NF_TRAINING_URL || '' }}
        run: >-
          python -m tests.training_overlap --url-env NF_TRAINING_URL --json lane/training-overlap.json
          --ids-out lane/training-cases.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Compare the models case by case (and with Typhoon 30B's saved run)
        if: ${{ !cancelled() }}
        env:
          FIRST: ${{ steps.choose.outputs.model_1 }}
          SECOND: ${{ steps.choose.outputs.model_2 }}
        run: |
          label() { if [ "$1" = "$FINETUNE_MODEL" ]; then echo "4B ปรับแต่งแล้ว (nf v01)"; else echo "Typhoon 2.5 4B ต้นฉบับ"; fi; }
          ARGS=()
          if [ -n "$SECOND" ]; then ARGS+=(--model "$(label "$SECOND")=lane/shadow-$SECOND-*.json"); fi
          ARGS+=(--model "$(label "$FIRST")=lane/shadow-$FIRST-*.json")
          ARGS+=(--model "Typhoon 30B ผ่าน API (รอบ 2026-11-11 คนละเครื่อง)=docs/evidence/2026-11-11-attention-raw/typhoon-v2-*.json")
          if [ -f lane/training-cases.json ]; then ARGS+=(--training-cases lane/training-cases.json); fi
          if ls lane/shadow-*.json > /dev/null 2>&1; then
            python -m tests.local_model_compare "${ARGS[@]}" --summary "$GITHUB_STEP_SUMMARY" --json lane/comparison.json
          fi
      - name: Show the end of the model servers' logs when something failed
        if: ${{ failure() }}
        run: tail -n 40 "$RUNNER_TEMP"/llama-server-*.log || true
      - name: Keep the reports (JSON only; never a model file)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: local-model-eval
          path: lane/*.json
          if-no-files-found: ignore
