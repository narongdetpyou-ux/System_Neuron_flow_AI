name: Secret scan
# Scans every commit on every branch for keys and tokens with gitleaks (roadmap 7.4), so the history is known
# to be clean before the repository is ever made public. Findings are redacted in the log.
# Rules: gitleaks' defaults plus a Sentry DSN rule (.github/gitleaks.toml). Findings that were reviewed are
# listed with a reason in .github/.gitleaksignore; anything else fails this check.
# The commit-emails job checks that new commits carry no personal e-mail address (the review of 2026-11-10,
# point 1; .github/scripts/check_commit_emails.py): a pull request fails, a push only warns, so a merge made
# with a personal address never stops Render's deploy-after-checks. Addresses are never printed.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every commit of every branch, not only the latest one
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # Built from the tagged source: the Go checksum database verifies every module, so no hash is pinned here.
      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the whole history
        run: >-
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --config .github/gitleaks.toml
          --gitleaks-ignore-path .github/.gitleaksignore --redact --verbose --no-banner
      # Scan again without the reviewed list: every entry in it must still be found. This proves the rules
      # still catch those findings, and it fails when an entry no longer matches anything (a stale list).
      - name: Check that every reviewed finding is still found
        run: |
          mkdir -p "$RUNNER_TEMP/no-ignores"
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --config .github/gitleaks.toml \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores" --redact --no-banner --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/all-findings.json"
          python3 - "$RUNNER_TEMP/all-findings.json" .github/.gitleaksignore <<'EOF'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              found = {finding["Fingerprint"] for finding in json.load(report)}
          with open(sys.argv[2], encoding="utf-8") as reviewed:
              listed = {line.strip() for line in reviewed if line.strip() and not line.startswith("#")}
          print(f"{len(found)} finding(s) in the history before the reviewed list; {len(listed)} reviewed")
          stale = sorted(listed - found)
          if stale:
              sys.exit("No longer found, remove from .github/.gitleaksignore: " + ", ".join(stale))
          EOF
  commit-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the pushed or proposed commits, and the whole history for the count
      - name: Check the e-mail addresses of new commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FAIL_FLAG: ${{ github.event_name == 'pull_request' && '--fail' || '' }}
        run: >-
          python3 .github/scripts/check_commit_emails.py --base "$BASE_SHA" --head "$HEAD_SHA" --history
          --summary "$GITHUB_STEP_SUMMARY" $FAIL_FLAG
