name: Core logic tests
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Run synthetic domain demonstration
        run: python -m examples.case_triage_demo
      - name: Run shadow-mode demonstration (offline mock AI)
        run: python -m examples.case_triage_shadow_demo
      # The study guide's answers to four synthetic requests, shown on the run page (roadmap 3.2).
      - name: Run study guide demonstration (offline mock AI)
        run: python -m examples.study_guide_demo --summary "$GITHUB_STEP_SUMMARY"
      # Skill handoff (ADR-030, docs/skill_handoff.md): one case step by step through the exchange and its
      # translators, shown on the run page.
      - name: Run skill handoff demonstration (offline mock AI)
        run: python -m examples.skill_handoff_demo --summary "$GITHUB_STEP_SUMMARY"
      # Eval gate (roadmap 5.2): fails when any case answers differently from the committed baseline. It runs
      # even when an earlier step failed, so the run page always lists what changed.
      - name: Score shadow mode and compare every case with the baseline (offline mock AI)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.triage_shadow_eval --summary "$GITHUB_STEP_SUMMARY" --out shadow-eval-mock.json
          --compare-with tests/baselines/shadow_eval_mock.json
      - name: Compare rules v1 and v2 on development cases (same mock answers)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.rules_comparison --report shadow-eval-mock.json
          --out rules-comparison-mock.json --summary "$GITHUB_STEP_SUMMARY"
      # Auto-approve limits (ADR-031, docs/autosend_simulation.md): the 128 hard cases with the mock, compared with
      # their baseline, then the simulation of a button that sends without a person. A replay only: it fails if a
      # real job did not wait for a person. The live run with Typhoon is the manual workflow "Auto-approve limits".
      - name: Score the hard auto-send set and compare every case with the baseline (offline mock AI)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.triage_shadow_eval --golden app/eval/golden/case_triage_autosend_hard_v1.json
          --out autosend-hard-mock.json --compare-with tests/baselines/autosend_hard_mock.json
      # Attention signals (ADR-032): the 64 held-out cases with the mock, every answer against its baseline. The
      # scorecard on the run page shows how many cases a person should see first were raised, and the misses.
      - name: Score the held-out attention set and compare every case with the baseline (offline mock AI)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.triage_shadow_eval --golden app/eval/golden/case_triage_attention_heldout_v1.json
          --out attention-heldout-mock.json --summary "$GITHUB_STEP_SUMMARY"
          --compare-with tests/baselines/attention_heldout_mock.json
      - name: Simulate an auto-approve button on the saved mock answers (a replay; nothing is sent)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.autosend_sim --report autosend-hard-mock.json --report shadow-eval-mock.json
          --report attention-heldout-mock.json
          --out autosend-sim-mock.json --summary "$GITHUB_STEP_SUMMARY"
      # The study guide's scorecard and eval gate (roadmap 3.3): fails when a promise breaks (a link outside the
      # library, more than 5 resources) or when any request answers differently from the baseline.
      - name: Score the study guide and compare every request with the baseline (offline mock AI)
        if: ${{ !cancelled() }}
        run: >-
          python -m app.eval.study_guide_eval --summary "$GITHUB_STEP_SUMMARY" --out study-guide-eval-mock.json
          --compare-with tests/baselines/study_guide_eval_mock.json
      # Robustness benchmark, stage 1 (roadmap 5.4, docs/benchmarking.md): 270 synthetic edge cases and four pinned open
      # datasets through intake, rules, masking, AI replies, Core contracts and whole jobs, offline (mock AI and a local
      # fake of the Typhoon API). Fails when any item's outcome differs from the baseline, which records failures too.
      - name: Robustness benchmark, stage 1 (compares every item with the baseline)
        if: ${{ !cancelled() }}
        run: >-
          python -m tests.robustness.bench --summary "$GITHUB_STEP_SUMMARY" --out robustness.json
          --compare-with tests/baselines/robustness_v1.json
      # The exchange with the existing sets (ADR-030): every case of the three triage sets (61 development, 40 held-out,
      # 116 edge) end to end through admission, the Runner, a decision and the apply job. Fails on any broken check.
      - name: Skill handoff check over the three triage case sets (offline mock AI)
        if: ${{ !cancelled() }}
        run: python -m tests.handoff_check --summary "$GITHUB_STEP_SUMMARY" --json handoff-eval-mock.json
      # The local model lane's end-to-end check (ADR-034) against a stand-in for llama.cpp's server, with every fault
      # the stand-in can make: the real service with the local provider, people's decisions, receipts, timeouts, a
      # server that does not answer, and answers that are not JSON, outside the schema, cut off or refused. The real
      # model file runs in *Local open model eval*.
      - name: End-to-end check of the local provider with a stand-in model server (no model file)
        if: ${{ !cancelled() }}
        run: |
          python tests/fake_llama_server.py --alias stand-in:000000000000 --port 18080 > "$RUNNER_TEMP/fake-llama.log" 2>&1 &
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:18080/health > /dev/null 2>&1 && break; sleep 0.2; done
          python -m tests.local_model_e2e --llm-base-url http://127.0.0.1:18080/v1 --model-id stand-in:000000000000 \
            --phases service,failures,faults --fake-control --job-timeout-s 120 \
            --summary "$GITHUB_STEP_SUMMARY" --json local-e2e-fake.json
      - name: Keep the scorecards
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-mock
          path: |
            shadow-eval-mock.json
            rules-comparison-mock.json
            autosend-hard-mock.json
            autosend-sim-mock.json
            study-guide-eval-mock.json
            robustness.json
            handoff-eval-mock.json
            local-e2e-fake.json
