name: Shadow eval with Typhoon (manual)
# Scores shadow mode on the synthetic case set with Typhoon, SCB 10X's Thai-first model (ADR-021).
# Typhoon's hosted API is free (a research showcase, rate-limited: about 200 requests a minute, 5 a second)
# and collects usage data to improve its models, which is acceptable only because every case is synthetic.
# Needs the repository secret TYPHOON_API_KEY (Settings -> Secrets and variables -> Actions).
# Cases start at least 1 second apart; transient failures may retry. all_e2 measures
# development (61), partly-development edges (116), and held-out (40) separately.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Typhoon model id"
        default: "typhoon-v2.5-30b-a3b-instruct"
        required: true
      limit:
        description: "Only the first N cases (leave empty for all)"
        default: ""
        required: false
      case_set:
        description: "Case set, or all_e2 for the three-set rules comparison (217 cases)"
        type: choice
        options:
          - synthetic_v1
          - robustness_edge_v1
          - heldout_v1
          - all_e2
        default: synthetic_v1
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEURON_FLOW_LLM_PROVIDER: typhoon
      NEURON_FLOW_LLM_MODEL: ${{ inputs.model }}
      LIMIT: ${{ inputs.limit }}
      CASE_SET: ${{ inputs.case_set }}
      TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the API key is configured
        run: |
          if [ -z "$TYPHOON_API_KEY" ]; then
            echo "::error::Add the repository secret TYPHOON_API_KEY (Settings -> Secrets and variables -> Actions), then run again."
            exit 1
          fi
      - name: Check the connection with one fixed sentence
        continue-on-error: true
        run: PYTHONPATH=. python .github/scripts/llm_probe.py "$GITHUB_STEP_SUMMARY"
      - name: Score shadow mode with Typhoon
        run: |
          ARGS=()
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          SETS=("$CASE_SET")
          if [ "$CASE_SET" = "all_e2" ]; then SETS=(synthetic_v1 robustness_edge_v1 heldout_v1); fi
          COMPARE=()
          for SET in "${SETS[@]}"; do
            case "$SET" in
              synthetic_v1) GOLDEN=app/eval/golden/case_triage_synthetic_v1.json ;;
              robustness_edge_v1) GOLDEN=tests/robustness/triage_edge_golden_v1.json ;;
              heldout_v1) GOLDEN=app/eval/golden/case_triage_heldout_v1.json ;;
              *) echo "::error::Unknown case set"; exit 1 ;;
            esac
            REPORT="shadow-eval-typhoon-$SET.json"
            python -m app.eval.triage_shadow_eval --golden "$GOLDEN" --min-interval-s 1 \
              --summary "$GITHUB_STEP_SUMMARY" --out "$REPORT" "${ARGS[@]}"
            COMPARE+=(--report "$REPORT")
          done
          # Replay v1 and v2 against the same saved model answers, without extra API calls.
          python -m app.eval.rules_comparison "${COMPARE[@]}" \
            --out rules-comparison-typhoon.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-eval-typhoon
          path: |
            shadow-eval-typhoon-*.json
            rules-comparison-typhoon.json
          if-no-files-found: ignore
